name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://gridwatch:gridwatch@localhost:5432/gridwatch
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-placeholder-secret-key
      DEBUG: "False"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gridwatch
          POSTGRES_USER: gridwatch
          POSTGRES_PASSWORD: gridwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gridwatch -d gridwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: pytest
